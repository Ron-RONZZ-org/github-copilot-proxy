name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff pytest

      - name: Ruff
        run: ruff check app.py tests/

      - name: Pytest
        run: pytest tests/ -q

      - name: Import check
        run: python -c "import app; print('app imports cleanly')"

  image-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t github-copilot-proxy:ci .

      - name: Smoke test — the server starts and serves the model list
        run: |
          docker run -d --name proxy -p 18080:8080 \
            -e CONFIG_PATH=/app/config.example.json \
            github-copilot-proxy:ci
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:18080/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18080/health
          echo
          curl -fsS http://127.0.0.1:18080/v1/models
          echo
          docker rm -f proxy
