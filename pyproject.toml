[project]
name = "github-copilot-proxy"
version = "1.0.0"
description = "GitHub Copilot 'auto' model selection, exposed as an OpenAI-compatible API"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["aiohttp==3.14.5"]

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
